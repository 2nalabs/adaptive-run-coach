<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06131f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Adaptive Run Coach" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>Adaptive Run Coach</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><img src="icon-192.png" alt="" /><div><strong>Adaptive Run Coach</strong><span>Run · Adapt · Progress</span></div></div>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙</button>
    </header>

    <main id="app"></main>

    <nav class="bottom-nav" aria-label="Primary">
      <button data-tab="today" class="active"><span>⌂</span>Today</button>
      <button data-tab="plan"><span>▤</span>Plan</button>
      <button data-tab="history"><span>◷</span>History</button>
      <button data-tab="coach"><span>✦</span>Coach</button>
    </nav>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
